<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Loop">
<meta name="description" content="Innen Kultur Loop-Tracker – deine Daten bleiben auf deinem Gerät.">
<title>Innen Kultur Loop</title>
<meta name="theme-color" content="#F7EFE6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500&family=Instrument+Serif:ital@1&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: App-Shell – mobil eine Spalte mit Tab-Leiste unten, ab 900px Navigation oben und Karten nebeneinander. Farben aus dem CI-Leitfaden. */
:root{
  --bg:#F7EFE6; --card:#FFFFFF; --ink:#2B231E; --muted:#8A5A3A; --soft:#5C4535;
  --coral:#E9765B; --coral-t:#C2553D; --sand:#F0E0CD; --line:#EFE3D5;
  --hero:#2B231E; --hero-ink:#F7EFE6; --hero-soft:#F0E0CD; --hero-tile:#3A2F28;
  --p-e:#E9765B; --p-b:#D9B48F; --p-s:#B07A55;
  --field:#F7EFE6; --sel:#2B231E; --sel-ink:#FFFFFF; --shadow:0 1px 2px rgba(43,35,30,.06);
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-accent:"Instrument Serif",Georgia,serif;
  --f-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r-card:20px; --r-ctl:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1512; --card:#26201B; --ink:#F7EFE6; --muted:#D2AE90; --soft:#E5D2C0;
  --coral:#EE8468; --coral-t:#F29A80; --sand:#3A2F28; --line:#352C26;
  --hero:#0F0C0A; --hero-ink:#F7EFE6; --hero-soft:#E5D2C0; --hero-tile:#2B231E;
  --field:#332A24; --sel:#F7EFE6; --sel-ink:#2B231E; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1512; --card:#26201B; --ink:#F7EFE6; --muted:#D2AE90; --soft:#E5D2C0;
  --coral:#EE8468; --coral-t:#F29A80; --sand:#3A2F28; --line:#352C26;
  --hero:#0F0C0A; --hero-ink:#F7EFE6; --hero-soft:#E5D2C0; --hero-tile:#2B231E;
  --field:#332A24; --sel:#F7EFE6; --sel-ink:#2B231E; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.logo-d{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-l{display:none}:root:not([data-theme="light"]) .logo-d{display:block}}
:root[data-theme="dark"] .logo-l{display:none}:root[data-theme="dark"] .logo-d{display:block}

/* Shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top img{height:26px;width:auto}
.plan{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--sand);padding:5px 10px;border-radius:999px;white-space:nowrap}
.nav-d{display:none;gap:4px}
.nav-d button,.tabs button{background:none;border:0;color:var(--muted)}
.nav-d button{padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px}
.nav-d button[aria-current="page"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px 110px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:6px 0;border-radius:10px}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] svg{stroke:var(--coral)}
@media (min-width:900px){.nav-d{display:flex}.tabs{display:none}main{padding-bottom:48px}}

/* Typo */
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-size:clamp(28px,6vw,40px);line-height:1.05;letter-spacing:-.04em;font-weight:700;text-wrap:balance}
h1 em{font-family:var(--f-accent);font-style:italic;font-weight:400;color:var(--coral-t);letter-spacing:0}
h2{margin:0;font-size:17px;letter-spacing:-.02em;font-weight:700}
.lead{margin:0;color:var(--soft);max-width:60ch}
.head{display:flex;flex-direction:column;gap:8px;padding:10px 0 4px}
.lbl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Cards */
.card{background:var(--card);border-radius:var(--r-card);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0}
.card.dark{background:var(--hero);color:var(--hero-ink)}
.card.dark .lbl{color:var(--hero-soft)}
.card.sand{background:var(--sand)}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:700px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:1.25fr 1fr 1fr 1fr}.g21{grid-template-columns:1.5fr 1fr}}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}

/* Controls */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow)}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink)}
.chip[disabled]{opacity:.4;cursor:not-allowed}
.chip .mk{width:6px;height:6px;border-radius:50%;background:var(--coral)}
.toggle{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--field);border-radius:14px;padding:14px;text-align:left;min-height:58px}
.toggle .tx{flex:1;font-weight:600}
.toggle .tx small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.box{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.toggle[aria-pressed="true"] .box{background:var(--sel);border-color:var(--sel)}
.box svg{width:16px;height:16px;stroke:var(--sel-ink);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.toggle[aria-pressed="true"] .box svg{opacity:1}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg.s8{grid-template-columns:repeat(8,1fr)}
.seg button{border:0;background:var(--field);border-radius:10px;height:44px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink)}
.seg-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.q{display:flex;flex-direction:column;gap:8px}
.q>span{font-weight:600}
.step{display:flex;align-items:center;gap:8px}
.step button{width:44px;height:44px;border-radius:12px;border:0;background:var(--field);font-size:20px;font-weight:600}
.step output{min-width:86px;text-align:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.step output.low{color:var(--muted)}
textarea,input[type=text]{width:100%;border:0;background:var(--field);border-radius:12px;padding:12px 14px;resize:vertical}
textarea::placeholder,input::placeholder{color:var(--muted);font-style:italic}
.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:700;background:var(--sel);color:var(--sel-ink)}
.btn.ghost{background:var(--field);color:var(--ink)}
.btn.warn{background:transparent;color:var(--coral-t);padding-inline:0}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:13px;color:var(--muted)}
.ok{font-size:13px;font-weight:600;color:var(--coral-t)}

/* Score */
.score{display:flex;align-items:baseline;gap:10px}
.score b{font-size:64px;line-height:.95;letter-spacing:-.05em;color:var(--coral);font-variant-numeric:tabular-nums}
.score span{color:var(--hero-soft);font-size:15px}
.deltas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dt{background:var(--hero-tile);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.dt b{font-size:22px;color:var(--hero-ink);font-variant-numeric:tabular-nums}
.msg{margin:0;font-weight:600;font-size:15px}
.pill-card{border-top:6px solid var(--c)}
.pv{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.pv b{font-size:44px;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.pv .df{text-align:right}
.pv .df b{font-size:24px;color:var(--coral-t);letter-spacing:-.02em}
.bar{height:8px;border-radius:8px;background:var(--field);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:8px;background:var(--c)}
.bar u{position:absolute;top:-4px;width:2px;height:16px;border-radius:2px;background:var(--ink)}
.kv{display:flex;justify-content:space-between;font-size:14px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-family:var(--f-mono);font-weight:500;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 0}
th:first-child,td:first-child{text-align:left}
td{padding:10px 0;border-top:1px solid var(--line);text-align:right;font-size:15px}
td.now{font-weight:700;font-size:17px}
td.diff{font-weight:700;font-size:17px;color:var(--coral-t)}
.chart svg{width:100%;height:auto;display:block}
.recap{margin:0;font-size:17px;font-weight:600;line-height:1.4}
.empty{color:var(--muted);font-size:14px}
.lock{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--soft)}

/* Onboarding */
.ob{min-height:100%;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px}
.ob .card{max-width:440px;width:100%;gap:18px;padding:26px}
.ob img{height:30px;width:auto;align-self:flex-start}
.qr{background:#FFFFFF;border-radius:14px;padding:12px;align-self:center;max-width:100%}
.qr img,.qr svg{display:block;width:220px;max-width:100%;height:auto}
.mono{font-family:var(--f-mono);font-size:12px;word-break:break-all;background:var(--field);border-radius:10px;padding:10px;max-height:90px;overflow:auto}
.steps-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .25s ease}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function(){
const LOGO_L = "icons/logo_l.png", LOGO_D = "icons/logo_d.png";
const KEY = "ik-loop-v1";
const P = {e:"var(--p-e)", b:"var(--p-b)", s:"var(--p-s)"};
const ICON = {
  dash:'<svg viewBox="0 0 24 24"><path d="M4 13a8 8 0 1 1 16 0"/><path d="M12 13l4-4"/><path d="M4 19h16"/></svg>',
  track:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>',
  week:'<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
  start:'<svg viewBox="0 0 24 24"><path d="M6 20V5"/><path d="M6 5h10l-2 3.5 2 3.5H6"/></svg>',
  data:'<svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>'
};
const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* ---------- Speicher (nur auf diesem Gerät) ---------- */
function blank(){return {v:1, code:"", plan:0, start:null, days:{}, ci:{}, lastBackup:null, demo:false};}
let S = load();
function load(){try{const r=localStorage.getItem(KEY); if(r){const o=JSON.parse(r); return Object.assign(blank(),o);}}catch(e){} return blank();}
function save(){try{localStorage.setItem(KEY, JSON.stringify(S));}catch(e){}}

/* ---------- Rechnung (identisch zum Tracker-Konzept) ---------- */
const R = Math.round;
const isNum = v => typeof v === "number" && !isNaN(v);
function entered(d){return !!d && (d.t||d.f||d.a||isNum(d.h)||isNum(d.er)||isNum(d.en)||isNum(d.ba));}
function idx(w,d){return w*7+d+1;}
function startScores(){const s=S.start; if(!s||![s.t,s.f,s.a,s.s].every(isNum)) return null;
  const E=R((s.t+s.f)/14*100), B=R(s.a/7*100), Sl=R(s.s/7*100); return {E,B,S:Sl,L:R((E+B+Sl)/3)};}
function weekData(w){let n=0,t=0,f=0,a=0,s7=0,h=[],er=[],en=[],ba=[];
  for(let d=0;d<7;d++){const x=S.days[idx(w,d)]; if(!entered(x)) continue; n++;
    if(x.t)t++; if(x.f)f++; if(x.a)a++; if(isNum(x.h)&&x.h>=7)s7++;
    if(isNum(x.h))h.push(x.h); if(isNum(x.er))er.push(x.er); if(isNum(x.en))en.push(x.en); if(isNum(x.ba))ba.push(x.ba);}
  return {n,t,f,a,s7,h,er,en,ba};}
const avg = a => a.length ? a.reduce((p,c)=>p+c,0)/a.length : null;
function weekScore(w){const wd=weekData(w), m=(S.ci[w]&&S.ci[w].man)||[];
  const rate=(i,c)=> isNum(m[i]) ? m[i]/7 : (wd.n>0 ? c/wd.n : null);
  const rT=rate(0,wd.t), rF=rate(1,wd.f), rA=rate(2,wd.a), rS=rate(3,wd.s7);
  const ef=[rT,rF].filter(v=>v!==null);
  const E= ef.length? R(avg(ef)*100):null, B= rA!==null?R(rA*100):null, Sl= rS!==null?R(rS*100):null;
  const ps=[E,B,Sl].filter(v=>v!==null);
  return {E,B,S:Sl,L: ps.length? R(avg(ps)):null, wd};}
function rolling(){let last=0; Object.keys(S.days).forEach(k=>{if(entered(S.days[k])) last=Math.max(last,+k);});
  if(!last) return {last:0,n:0};
  let n=0,t=0,f=0,a=0,s7=0,h=[],er=[],en=[],ba=[];
  for(let i=Math.max(1,last-6);i<=last;i++){const x=S.days[i]; if(!entered(x)) continue; n++;
    if(x.t)t++; if(x.f)f++; if(x.a)a++; if(isNum(x.h)&&x.h>=7)s7++;
    if(isNum(x.h))h.push(x.h); if(isNum(x.er))er.push(x.er); if(isNum(x.en))en.push(x.en); if(isNum(x.ba))ba.push(x.ba);}
  const E=R((t+f)/(2*n)*100), B=R(a/n*100), Sl=R(s7/n*100);
  return {last,n,E,B,S:Sl,L:R((E+B+Sl)/3),h:avg(h),er:avg(er),en:avg(en),ba:avg(ba)};}
function overview(){const ro=rolling(); let lastLoopWk=0;
  for(let w=0;w<S.plan;w++){ if(weekScore(w).L!==null) lastLoopWk=w+1; }
  const cur = ro.last ? Math.max(Math.floor((ro.last-1)/7)+1, lastLoopWk) : lastLoopWk;
  const hero = ro.n ? {L:ro.L,E:ro.E,B:ro.B,S:ro.S} : (lastLoopWk ? weekScore(lastLoopWk-1) : null);
  const prev = cur>1 ? weekScore(cur-2).L : null;
  return {ro,cur,hero,prev,lastLoopWk};}
const sign = v => (v>=0?"+":"")+v;
const fmt1 = v => v===null||v===undefined ? "–" : v.toFixed(1).replace(".",",");

/* ---------- Navigation ---------- */
let view = "dash", wSel = 0, dSel = 0, cSel = 0, flash = "", confirmWipe = false, transfer = null;
const TABS = [["dash","Dashboard"],["track","Tracker"],["week","Check-in"],["start","Start"],["data","Daten"]];
function go(v){view=v; flash=""; confirmWipe=false; transfer=null; render(); window.scrollTo(0,0);}

function render(){
  const app=document.getElementById("app");
  if(!S.plan){app.innerHTML=onboarding(); bindOnboarding(); return;}
  const nav = TABS.map(([k,l])=>`<button data-go="${k}" ${view===k?'aria-current="page"':''}>${l}</button>`).join("");
  const tabs = TABS.map(([k,l])=>`<button data-go="${k}" ${view===k?'aria-current="page"':''}>${ICON[k]}<span>${l}</span></button>`).join("");
  const body = {dash:vDash,track:vTrack,week:vWeek,start:vStart,data:vData}[view]();
  app.innerHTML = `<header class="top"><div class="top-in"><span><img class="logo-l" src="${LOGO_L}" alt="innen kultur"><img class="logo-d" src="${LOGO_D}" alt="innen kultur"></span>
    <nav class="nav-d" aria-label="Bereiche">${nav}</nav><span class="plan">${S.plan===8?"Komplett":"Basis"}${S.demo?" · Demo":""}</span></div></header>
    <main><div class="wrap view">${body}</div></main><nav class="tabs" aria-label="Bereiche">${tabs}</nav>`;
  bind();
}

/* ---------- Onboarding ---------- */
function onboarding(){return `<div class="ob"><div class="card">
  <img class="logo-l" src="${LOGO_L}" alt="innen kultur"><img class="logo-d" src="${LOGO_D}" alt="innen kultur">
  <div class="head" style="padding:0"><span class="eyebrow">○ Loop-Tracker</span><h1>Willkommen in deinem <em>Loop.</em></h1>
  <p class="lead">Gib den Code aus deiner Kaufbestätigung ein. Deine Einträge bleiben auf diesem Gerät, wir speichern nichts.</p></div>
  <form id="ob-f" class="q"><label for="ob-code" class="lbl">Freischaltcode</label>
  <input id="ob-code" type="text" autocomplete="off" autocapitalize="characters" placeholder="z. B. KOMPLETT-DEMO">
  <span id="ob-err" class="ok" hidden>Dieser Code ist unbekannt. Er beginnt mit BASIS- oder KOMPLETT-.</span>
  <button class="btn" type="submit">Freischalten</button></form>
  <div class="q"><span class="lbl">Prototyp</span><div class="btns"><button class="btn ghost" data-demo="8">Demo mit Beispieldaten</button><button class="btn ghost" data-code="BASIS-DEMO">Leer starten (Basis)</button></div>
  <p class="note">Tipp: Im Browser „Zum Home-Bildschirm“ wählen, dann startet der Tracker wie eine App, auch offline.</p></div>
  </div></div>`;}
function bindOnboarding(){
  document.getElementById("ob-f").addEventListener("submit",e=>{e.preventDefault(); unlock(document.getElementById("ob-code").value);});
  document.querySelectorAll("[data-code]").forEach(b=>b.onclick=()=>unlock(b.dataset.code));
  document.querySelectorAll("[data-demo]").forEach(b=>b.onclick=()=>{loadDemo(); view="dash"; render();});
}
function planFor(code){const c=(code||"").trim().toUpperCase(); if(/^KOMPLETT-[A-Z0-9]{4,}$/.test(c)) return 8; if(/^BASIS-[A-Z0-9]{4,}$/.test(c)) return 4; return 0;}
function unlock(code){const p=planFor(code); if(!p){const e=document.getElementById("ob-err")||null; if(e) e.hidden=false; return false;}
  S.code=code.trim().toUpperCase(); S.plan=p; save(); view=S.start?"dash":"start"; render(); return true;}

/* ---------- Start-Check ---------- */
const SQ=[["t","e","An wie vielen Tagen hattest du einen Pflanzen-Teller?"],["f","e","An wie vielen Tagen hast du etwas Fermentiertes gegessen?"],
  ["a","b","An wie vielen Tagen warst du mindestens 30 Minuten aktiv?"],["s","s","In wie vielen Nächten hast du mindestens 7 Stunden geschlafen?"]];
const FEEL=[["er","Wie erholt wachst du meistens auf?"],["en","Wie ist deine Energie über den Tag?"],["ba","Wie fühlt sich dein Bauch an?"]];
function seg(name,val,from,to,cls=""){let h=`<div class="seg ${cls}" role="group">`;
  for(let i=from;i<=to;i++) h+=`<button type="button" data-set="${name}" data-v="${i}" aria-pressed="${val===i}">${i}</button>`; return h+"</div>";}
function vStart(){const s=S.start||{}, sc=startScores();

  const fl=FEEL.map(([k,q])=>`<div class="q"><span>${q}</span>${seg("start."+k,s[k],1,5)}<div class="seg-cap"><span>1 · schlecht</span><span>5 · sehr gut</span></div></div>`).join("");
  return `<div class="head"><span class="eyebrow">○ Start-Check · einmal vor Woche 1 · 2 Minuten</span><h1>Wo stehst du <em>heute?</em></h1>
  <p class="lead">Denk an die letzten 7 Tage und trag ehrlich ein, was du gemacht hast. Daraus entsteht dein Start-Loop-Score.</p></div>
  <div class="grid g21"><div class="card">${qs}</div>
  <div class="grid" style="align-content:start"><div class="card dark"><span class="lbl">Dein Start-Loop-Score</span>
   ${sc?`<div class="score"><b>${sc.L}</b><span>von 100</span></div>
   ${[["Ernährung & Darm",sc.E,"e"],["Bewegung",sc.B,"b"],["Schlaf",sc.S,"s"]].map(([n,v,p])=>`<div class="q" style="gap:5px"><div class="kv"><span>${n}</span><b class="num">${v}</b></div><div class="bar" style="--c:${P[p]};background:var(--hero-tile)"><i style="width:${v}%"></i></div></div>`).join("")}`
   :`<p class="msg" style="color:var(--hero-soft)">Beantworte die vier Fragen, dann erscheint dein Score.</p>`}</div></div></div>
  <div class="card"><div class="row"><h2>Resultat · wie fühlst du dich gerade?</h2></div>
  <div class="q"><span>Wie viele Stunden schläfst du im Schnitt?</span>${stepper("start.sl", s.sl)}</div>${fl}</div>`;}
function stepper(name,val){const v=isNum(val)?val:null;
  return `<div class="step"><button type="button" data-step="${name}" data-d="-0.5" aria-label="weniger">−</button><output class="${v!==null&&v<7?"low":""}">${v===null?"– h":fmt1(v)+" h"}</output><button type="button" data-step="${name}" data-d="0.5" aria-label="mehr">+</button></div>`;}

/* ---------- Tracker ---------- */

  return h+"</div>";}

const ZUF=["gar nicht","eher nicht","teils","zufrieden","sehr zufrieden"], STR=["entspannt","eher ruhig","normal","angespannt","sehr gestresst"];
function vWeek(){const c=S.ci[cSel]||{}, ws=weekScore(cSel), wd=ws.wd, man=c.man||[], st=startScores();

    <div class="q"><label for="rec" style="font-weight:600">Was hast du für dein späteres Ich getan?</label><textarea id="rec" rows="3" placeholder="z. B. Jeden Tag einen Pflanzen-Teller geschafft.">${esc(c.rec||"")}</textarea></div>
   </div>

    ${ws.L!==null?`<div class="score"><b>${ws.L}</b><span>von 100</span></div>`:`<div class="score"><b style="color:var(--hero-tile)">–</b></div>`}

  <div class="grid g21">
   <div class="card"><h2>Resultat · wie du dich fühlst</h2><div style="overflow-x:auto"><table><thead><tr><th></th><th>Start</th><th>Aktuell</th><th>Differenz</th></tr></thead><tbody>
    ${feel.map(([n,a,b,u])=>`<tr><td>${n}</td><td>${isNum(a)?fmt1(a)+u:"–"}</td><td class="now">${b===null||b===undefined?"–":fmt1(b)+u}</td><td class="diff">${isNum(a)&&isNum(b)?(b-a>=0?"+":"−")+fmt1(Math.abs(b-a)):"–"}</td></tr>`).join("")}

    :`<button class="btn warn" data-wipe>Alle Daten auf diesem Gerät löschen</button>`}</div>

/* ---------- Kodierung für Sicherung und QR ---------- */
function compact(){const d={}; Object.keys(S.days).forEach(k=>{const x=S.days[k]; if(entered(x)||x.n) d[k]=[x.t?1:0,x.f?1:0,x.a?1:0,isNum(x.h)?x.h:null,x.er??null,x.en??null,x.ba??null,x.n||""];});
  return {v:1,c:S.code,p:S.plan,s:S.start,d,ci:S.ci};}
function expand(o){const n=blank(); n.code=o.c||""; n.plan=o.p||4; n.start=o.s||null; n.ci=o.ci||{};
  Object.keys(o.d||{}).forEach(k=>{const a=o.d[k]; n.days[k]={t:!!a[0],f:!!a[1],a:!!a[2],h:a[3],er:a[4],en:a[5],ba:a[6],n:a[7]||""};}); return n;}
const b64u = u8 => btoa(String.fromCharCode.apply(null,u8)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));
async function encode(obj){const raw=new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){try{const cs=new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw")); return "z"+b64u(new Uint8Array(await new Response(cs).arrayBuffer()));}catch(e){}}
  return "j"+b64u(raw);}
async function decode(code){code=code.trim().replace(/^.*#t=/,""); const kind=code[0], u8=unb64u(code.slice(1));
  if(kind==="z"){const ds=new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw")); return JSON.parse(await new Response(ds).text());}
  return JSON.parse(new TextDecoder().decode(u8));}

/* ---------- Events ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function setVal(path,v){const [scope,k]=path.split(".");
  if(scope==="start"){S.start=S.start||{}; S.start[k]=S.start[k]===v?undefined:v;}
  else if(scope==="day"){const id=idx(wSel,dSel); const d=S.days[id]=S.days[id]||{}; d[k]=d[k]===v?undefined:v;}
  else if(scope==="ci"){const c=S.ci[cSel]=S.ci[cSel]||{}; c[k]=c[k]===v?undefined:v;}
  else if(scope==="man"){const c=S.ci[cSel]=S.ci[cSel]||{}; c.man=c.man||[null,null,null,null]; c.man[+k]=c.man[+k]===v?null:v;}
  save(); render();}
function bind(){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>setVal(b.dataset.set,+b.dataset.v));
  document.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{const [scope,k]=b.dataset.step.split("."), tgt= scope==="start"?(S.start=S.start||{}):(S.days[idx(wSel,dSel)]=S.days[idx(wSel,dSel)]||{});
    const cur=isNum(tgt[k])?tgt[k]:7; tgt[k]= isNum(tgt[k]) ? Math.min(12,Math.max(3,cur+ +b.dataset.d)) : 7; save(); render();});
  document.querySelectorAll("[data-tg]").forEach(b=>b.onclick=()=>{const id=idx(wSel,dSel); const d=S.days[id]=S.days[id]||{}; d[b.dataset.tg]=!d[b.dataset.tg]; save(); render();});
  document.querySelectorAll("[data-wk]").forEach(b=>b.onclick=()=>{wSel=+b.dataset.wk; dSel=0; render();});
  document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{dSel=+b.dataset.day; render();});
  document.querySelectorAll("[data-ck]").forEach(b=>b.onclick=()=>{cSel=+b.dataset.ck; render();});
  const note=document.getElementById("note"); if(note) note.oninput=()=>{const id=idx(wSel,dSel); (S.days[id]=S.days[id]||{}).n=note.value; save();};
  const rec=document.getElementById("rec"); if(rec) rec.oninput=()=>{(S.ci[cSel]=S.ci[cSel]||{}).rec=rec.value; save();};
  const sm=document.querySelector("[data-selfmode]"); if(sm) sm.onclick=()=>{const c=S.ci[cSel]=S.ci[cSel]||{}; c.self=!c.self; if(!c.self) c.man=null; save(); render();};
  const bk=document.querySelector("[data-backup]"); if(bk) bk.onclick=backup;
  const imp=document.getElementById("imp"); if(imp) imp.onchange=()=>{const f=imp.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result); if(!o||!o.p) throw 0; S=expand(o); S.lastBackup=Date.now(); save(); flash="Sicherung geladen. Alle Einträge sind wieder da."; render();}catch(e){flash="Diese Datei ist keine Loop-Sicherung."; render();}}; r.readAsText(f);};
  const tr=document.querySelector("[data-transfer]"); if(tr) tr.onclick=makeTransfer;
  const cp=document.querySelector("[data-copy]"); if(cp) cp.onclick=()=>{const t=transfer.code; (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{cp.textContent="Kopiert";}).catch(()=>{const el=document.getElementById("tcode"); const s=window.getSelection(), rg=document.createRange(); rg.selectNodeContents(el); s.removeAllRanges(); s.addRange(rg); cp.textContent="Markiert – jetzt kopieren";});};
  const rv=document.querySelector("[data-receive]"); if(rv) rv.onclick=async()=>{const v=document.getElementById("tin").value; if(!v.trim()) return;
    try{const o=await decode(v); S=expand(o); save(); transfer=null; flash="Übertragung übernommen. Dieses Gerät hat jetzt denselben Stand."; render();}catch(e){flash="Der Code ist unvollständig. Kopier ihn noch einmal komplett."; render();}};
  const up=document.querySelector("[data-upgrade]"); if(up) up.onclick=()=>{const p=planFor(document.getElementById("up").value); if(p===8){S.plan=8; S.code=document.getElementById("up").value.trim().toUpperCase(); save(); flash="Komplett freigeschaltet: Woche 5 bis 8 sind offen.";} else flash="Für das Upgrade brauchst du einen Code, der mit KOMPLETT- beginnt."; render();};
  const py=document.querySelector("[data-pend-yes]"); if(py) py.onclick=()=>{S=expand(pending); pending=null; save(); flash="Übertragung übernommen."; render();};
  const pn=document.querySelector("[data-pend-no]"); if(pn) pn.onclick=()=>{pending=null; render();};
  const wp=document.querySelector("[data-wipe]"); if(wp) wp.onclick=()=>{confirmWipe=true; render();};
  const wn=document.querySelector("[data-wipe-no]"); if(wn) wn.onclick=()=>{confirmWipe=false; render();};
  const wy=document.querySelector("[data-wipe-yes]"); if(wy) wy.onclick=()=>{S=blank(); save(); view="dash"; confirmWipe=false; render();};
}
async function backup(){const name=`loop-sicherung-${new Date().toISOString().slice(0,10)}.json`, data=JSON.stringify(compact());
  const file=new File([data],name,{type:"application/json"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})&&/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){await navigator.share({files:[file],title:"Loop-Sicherung"});}
    else{const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);}
    S.lastBackup=Date.now(); save(); flash="Sicherung gespeichert.";
  }catch(e){flash = e&&e.name==="AbortError" ? "Sicherung abgebrochen." : "Speichern hat nicht geklappt. Nutze die Übertragung per Code.";}
  render();}
async function makeTransfer(){const code=await encode(compact()); const url=location.origin+location.pathname+"#t="+code; let svg="";
  try{const q=qrcode(0,"L"); q.addData(url); q.make(); svg=q.createSvgTag({cellSize:4,margin:2,scalable:true});}catch(e){svg="";}
  transfer={code,svg}; render();}

/* ---------- Beispieldaten ---------- */
function loadDemo(){S=blank(); S.code="KOMPLETT-DEMO"; S.plan=8; S.demo=true;
  S.start={t:3,f:1,a:2,s:3,sl:6.5,er:3,en:3,ba:3};
  const w1=[[1,1,1,7.2,3,3,3],[1,0,0,6.5,3,3,3],[1,1,1,7,3,3,3],[1,0,0,6,3,3,3],[0,0,1,7.5,3,4,3],[0,0,0,6.2,3,3,3],[0,0,0,6.8,3,3,3]];
  const w3=[[1,1,1,7.5,4,4,4,"Linsen-Bowl"],[1,0,0,6.8,3,3,4,"spät gegessen"],[1,1,1,7.2,4,4,4,""],[1,0,1,7,4,4,4,"25 Min. Kraft"],[0,1,0,6.5,3,3,3,"Feier"],[1,0,1,8,5,4,4,"langer Spaziergang"],[1,1,0,7.4,4,4,4,""]];
  [[0,w1],[2,w3]].forEach(([w,rows])=>rows.forEach((r,d)=>{S.days[idx(w,d)]={t:!!r[0],f:!!r[1],a:!!r[2],h:r[3],er:r[4],en:r[5],ba:r[6],n:r[7]||""};}));
  S.ci={0:{zuf:3,str:4,rec:"Drei Mal 30 Minuten spazieren."},1:{zuf:4,str:3,man:[5,3,4,4],self:true},2:{zuf:4,str:3,rec:"Jeden Tag einen Pflanzen-Teller geschafft, auch im Büro."}};
  wSel=2; dSel=6; cSel=2; save();}

async function fromLink(){const m=location.hash.match(/^#t=(.+)$/); if(!m) return false;
  try{const o=await decode(m[1]); const hasData=Object.keys(S.days).length||S.start;
    if(hasData){pending=o; view="data"; flash="";} else {S=expand(o); save(); view="dash"; flash="";}
  }catch(e){flash="Der Übertragungs-Link ist unvollständig.";}
  history.replaceState(null,"",location.pathname); return true;}
let pending=null;
fromLink().then(render);
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
})();
</script>
