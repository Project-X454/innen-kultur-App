<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="innen kultur">
<meta name="description" content="innen kultur – dein Abend-Check-in für Ernährung & Darm, Schlaf und Bewegung. Deine Daten bleiben auf deinem Gerät.">
<title>innen kultur</title>
<meta name="theme-color" content="#F5F7FA">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* CI „Weiß & Blau“ (SPEC §7). Säulenfarben immer zusammen mit Text oder Symbol. */
:root{color-scheme:light;
  --ink:#1B2733; --navy:#1E3A5A; --blue:#2D5F93; --soft:#EAF1F8; --bg:#F5F7FA; --line:#E1E7EF; --muted:#55606D; --card:#FFFFFF;
  --coral:#E9765B; /* nur Logo und Loop-Score-Ring */
  --darm:#5E8C72; --darm-soft:#E7F0EA; --darm-text:#2F5A42;
  --schlaf:#4F78A8; --schlaf-soft:#E6EDF6; --schlaf-text:#2E5582;
  --beweg:#C0583E; --beweg-soft:#F8E7E2; --beweg-text:#8E3A26;
  --recap:#A87A2C; --recap-soft:#F6EEDD; --recap-text:#6B4A10;
  --f-head:"Epilogue",system-ui,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-card:18px; --r-btn:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);overflow-x:hidden}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Shell */
main{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
main.full{padding-bottom:32px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 4px}
.top .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.top small{font-size:13px;color:var(--muted)}
.top b{font-family:var(--f-head);font-size:26px;letter-spacing:-.03em;line-height:1.1}
.iconbtn{flex:none;width:44px;height:44px;border-radius:14px;border:0;background:var(--card);display:grid;place-items:center;padding:0}
.iconbtn svg{width:22px;height:22px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;align-items:center;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tabs-in{display:flex;width:100%;max-width:560px;margin:0 auto}
.tabs button{flex:1;min-height:52px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--blue);font-weight:700}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs .ci span{width:54px;height:54px;border-radius:50%;background:var(--blue);display:grid;place-items:center;box-shadow:0 6px 16px -6px rgba(30,58,90,.6)}
.tabs .ci svg{stroke:#fff;stroke-width:2.4;width:24px;height:24px}

/* Typo */
h1{font-family:var(--f-head);font-weight:800;font-size:32px;line-height:1.08;letter-spacing:-.035em;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--blue)}
h2{font-size:16px;font-weight:700;margin:0}
.lead{margin:0;color:var(--muted);font-size:16px}
.note{margin:0;font-size:13px;color:var(--muted)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}

/* Karten */
.card{background:var(--card);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.navy{background:var(--navy);color:#fff}
.card.navy .note{color:#C9D6E6}
.card.soft{background:var(--soft)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c)}
.pill{align-self:flex-start;background:var(--soft);color:var(--blue);font-weight:700;font-size:13px;border-radius:999px;padding:6px 12px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--c,var(--blue))}
.tile b{font-family:var(--f-head);font-size:20px}
.tile b small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted)}

/* Buttons */
.btn{min-height:50px;border:0;border-radius:var(--r-btn);background:var(--blue);color:#fff;font-weight:700;font-size:16px;padding:12px 18px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;width:100%}
.btn.white{background:#fff;color:var(--navy)}
.btn.ghost{background:var(--soft);color:var(--blue)}
.btn.link{background:none;color:var(--blue);min-height:44px}
.btn.small{min-height:44px;font-size:15px;width:auto}
.btn.danger{background:none;color:var(--beweg-text);min-height:44px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.linkrow{min-height:44px;display:flex;align-items:center;gap:10px;border:0;border-radius:var(--r-btn);background:#27476B;color:#fff;font-size:13.5px;padding:10px 12px;text-align:left;width:100%}
.linkrow span:last-child{margin-left:auto}

/* Skalen 1–5: fünf gleich breite Buttons, ausgewählt = Navy gefüllt */
.scale{display:flex;flex-direction:column;gap:6px}
.scale>span{font-weight:600;display:flex;align-items:center;gap:8px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{min-height:44px;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-btn);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.seg-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* Auswahl (Ziele, Uhrzeit, Basis) */
.choice{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;text-align:left}
.choice b{font-weight:600}
.choice .box{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700}
.choice[aria-pressed="true"]{border-color:var(--blue);background:var(--soft)}
.choice[aria-pressed="true"] .box{background:var(--blue);border-color:var(--blue)}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.times button{min-height:44px;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-btn);font-weight:700}
.times button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.basis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.basis button{min-height:64px;border-radius:14px;border:1.5px solid var(--c);background:var(--card);color:var(--t);font-weight:700;font-size:14px;line-height:1.2;padding:8px 6px}
.basis button[aria-pressed="true"]{background:var(--c);color:#fff}
.bst{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;border:0;border-radius:14px;background:var(--s);padding:12px 14px;text-align:left;font-weight:700}
.bst .box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--c);display:grid;place-items:center;color:#fff;font-size:14px;background:var(--card)}
.bst[aria-pressed="true"] .box{background:var(--c)}
.bst small{margin-left:auto;font-weight:500;color:var(--muted)}

/* Zahlenfelder */
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.nums label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.nums input{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:var(--r-btn);background:var(--card);text-align:center;font-size:17px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
input[type=text]{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:var(--r-btn);background:var(--card);padding:10px 14px;font-size:16px}
textarea{width:100%;border:1.5px solid var(--line);border-radius:var(--r-btn);background:var(--card);padding:10px 14px;font-size:14px;resize:vertical}

/* Onboarding */
.ob-top{display:flex;align-items:center;gap:12px}
.steps{flex:1;display:flex;gap:8px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--blue)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-head);font-weight:800;font-size:24px;letter-spacing:-.03em}
.pillar{display:flex;align-items:center;gap:14px;background:var(--s);border-radius:16px;padding:14px}
.pillar .ic{flex:none;width:36px;height:36px;border-radius:10px;background:var(--c);display:grid;place-items:center}
.pillar .ic svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pillar b{display:block;font-size:16px}
.pillar span{font-size:14px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:end;height:110px}
.cols div{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.cols i{display:block;width:100%;max-width:36px;border-radius:8px 8px 4px 4px;background:var(--c)}
.cols span{font-size:11.5px;color:var(--muted);font-weight:600}
.err{color:var(--beweg-text);font-size:13px;font-weight:600;margin:0}
.okmsg{color:var(--darm-text);font-size:13px;font-weight:600;margin:0}

/* Wochen-Experiment */
.exp{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:14px}
.exp>span:nth-child(odd){display:flex;align-items:center;gap:8px}
.marks{display:flex;gap:4px}
.marks i{width:14px;height:14px;border-radius:4px;background:var(--line)}
.marks i.on{background:var(--c)}

/* Fortschritt */
.ring{display:flex;align-items:center;gap:16px}
.ring svg{flex:none;width:110px;height:110px}
.parts{display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
.parts .row{font-size:13.5px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
td:not(:first-child){text-align:right}
.hist{display:flex;gap:8px;flex-wrap:wrap}
.hist span{background:var(--soft);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--navy)}

/* Bibliothek: Wissen */
.partsw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.partsw button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:56px;padding:10px 14px;border:1.5px solid var(--line);border-radius:var(--r-btn);background:var(--card);color:var(--ink);text-align:left}
.partsw button b{font-family:var(--f-head);font-size:16px}
.partsw button span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.partsw button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.partsw button[aria-pressed="true"] span{color:#C9D6E6}
.partsw button.locked{border-style:dashed}
.tabsrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tabsrow.wk4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;overflow:visible}
.tabsrow.wk4 button{padding:8px 4px;font-size:14px;white-space:nowrap}
@media (min-width:960px){.tabsrow.wk4{display:flex}.tabsrow.wk4 button{padding:8px 14px;font-size:inherit}}
.tabsrow button{flex:none;min-height:40px;border:0;border-radius:999px;padding:8px 14px;font-weight:600;background:var(--card);color:var(--muted)}
.tabsrow button[aria-pressed="true"]{background:var(--navy);color:#fff}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini div{background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.mini b{font-size:14px}.mini span{font-size:12.5px;color:var(--muted)}
.wk-card{border-left:5px solid var(--c)}
.back{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;color:var(--muted);font-weight:600;font-size:14px;min-height:44px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;background:var(--bg);border-radius:10px;padding:10px;max-height:90px;overflow:auto}
.qr{background:#fff;border-radius:14px;padding:12px;align-self:center}
.qr svg{display:block;width:220px;max-width:100%;height:auto}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14.5px}
@media (prefers-reduced-motion:no-preference){.enter{animation:fade .18s ease}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}

/* Kurs, Video, Weiterlernen */
.learn{display:flex;gap:12px;align-items:center;width:100%;border:0;background:var(--card);border-radius:16px;padding:12px;text-align:left}
.learn .thumb{flex:none;width:74px;height:74px;border-radius:12px;background:var(--s);display:grid;place-items:center}
.learn .thumb svg{width:26px;height:26px;fill:var(--c)}
.learn .tx{display:flex;flex-direction:column;gap:3px;min-width:0}
.learn b{font-size:15px}
.vrow{display:flex;align-items:center;gap:10px;width:100%;min-height:58px;border:0;border-top:1px solid var(--line);background:none;padding:10px 0;text-align:left}
.vrow:first-child{border-top:0}
.vrow .st{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.vrow .st.on{background:var(--darm);border-color:var(--darm)}
.vrow .st.nx{border-color:var(--blue);color:var(--blue)}
.vrow .tx{display:flex;flex-direction:column;gap:1px;min-width:0}
.vrow b{font-weight:600;font-size:14.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.new{margin-left:auto;background:var(--navy);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.bst+.bst{margin-top:8px}
.tabsrow button[disabled]{opacity:.5}
.player{background:var(--navy);border-radius:var(--r-card);padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px;min-height:220px;color:#fff}
.player .iconbtn{background:rgba(255,255,255,.12);color:#fff}
.player .ph{flex:1;display:grid;place-items:center;text-align:center;font-size:14px;color:#C9D6E6;padding:0 20px}

/* Spalten-Gerüst: mobil unsichtbar (Inhalte stehen wie gehabt untereinander) */
.lay,.col,.masonry{display:contents}
.grid{display:flex;flex-direction:column;gap:12px}
.side{display:none}

/* Desktop-Browser ab 960 px: Seitenleiste, breitere Inhalte, zwei Spalten */
@media (min-width:960px){
  body{font-size:15.5px}
  #app.nav{padding-left:248px}
  #app.nav .tabs{display:none}
  .side{display:flex;flex-direction:column;gap:22px;position:fixed;z-index:20;top:0;bottom:0;left:0;width:248px;background:var(--card);border-right:1px solid var(--line);padding:28px 16px 20px;overflow-y:auto}
  .side .brand{font-size:21px;padding:0 8px}
  .side .brand svg{width:30px;height:30px}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side nav button,.side-ft button{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;border:0;background:none;border-radius:12px;padding:10px 12px;font-size:15px;font-weight:600;color:var(--muted);text-align:left}
  .side [aria-current="page"]{background:var(--soft);color:var(--blue);font-weight:700}
  .side svg{flex:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .side .btn svg{stroke:#fff;stroke-width:2.4}
  .side-ft{margin-top:auto;display:flex;flex-direction:column;gap:8px}
  .side-ft .note{padding:0 12px;font-size:12px}

  main{max-width:1120px;padding:40px 40px 56px;gap:16px}
  main.full{padding-bottom:56px}
  #app.nav .top .iconbtn[data-v="profil"]{display:none}
  .top{padding:0 0 4px}
  .top small{font-size:14px}
  .top b{font-size:34px}
  .card{padding:20px 22px}
  .lay{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
  .lay.side-r{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr)}
  .col{display:flex;flex-direction:column;gap:16px;min-width:0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .masonry{display:block;columns:2;column-gap:20px}
  .masonry>.card{break-inside:avoid;margin-bottom:20px}
  .masonry>.card:last-child{margin-bottom:0}
  .player{min-height:0;aspect-ratio:16/9}
  .btn.small{width:auto}
  .card>.btn.small{align-self:flex-start}
  .tabsrow{flex-wrap:wrap;overflow:visible}

  /* Check-in: fokussiert ohne Navigation, aber zweispaltig */
  .v-checkin main{max-width:1040px}

  /* Onboarding und Startpunkt: als Panel in der Seitenmitte */
  #app[class*="v-ob-"],#app.v-rebase{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:56px 24px}
  #app[class*="v-ob-"] main,#app.v-rebase main{width:100%;max-width:640px;margin:0;background:var(--card);border-radius:28px;padding:40px 48px;box-shadow:0 24px 60px -32px rgba(30,58,90,.35)}
  #app[class*="v-ob-"] main .card:not(.soft):not(.navy),#app.v-rebase main .card:not(.soft):not(.navy){background:var(--bg)}
  #app[class*="v-ob-"] .choice{background:var(--card)}
  #app.v-ob-welcome main{max-width:1080px;padding:56px 64px}
  .lay.hero{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:56px;align-items:center}
  .lay.hero h1{font-size:56px!important}
  .lay.hero .lead{font-size:18px}
  .lay.hero .col{gap:18px}
}
@media (min-width:960px) and (hover:hover){
  .btn:not([disabled]):hover{filter:brightness(1.08)}
  .side nav button:not([aria-current]):hover,.side-ft button:not([aria-current]):hover{background:var(--bg);color:var(--ink)}
  .learn,.vrow,.wk-card,.choice,.tabsrow button{transition:background-color .15s,box-shadow .15s}
  .learn:hover,.wk-card:hover{box-shadow:0 10px 28px -18px rgba(30,58,90,.45)}
  .vrow:hover{background:var(--bg)}
  .choice:not([disabled]):hover,.tabsrow button:not([disabled]):not([aria-pressed="true"]):hover{background:var(--soft)}
}

/* Freischalt-Hinweise: was, wann, wo, wieso */
.notices{display:flex;flex-direction:column;gap:12px}
.notice{border-left:5px solid var(--c);gap:8px}
.notice .nt{font-family:var(--f-head);font-size:17px;line-height:1.25}
.www{margin:0;display:grid;gap:6px}
.www div{display:grid;grid-template-columns:56px 1fr;gap:8px;font-size:14px;line-height:1.4}
.www dt{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.www dd{margin:0}
/* Starter-Liste */
.todo-mini{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.todo-mini>span{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:14px}
.todo-mini .btn{flex:none}
.todo{gap:10px}
.todo.done{opacity:.72}
.todo.focus{box-shadow:0 0 0 2px var(--blue)}
.todo-hd{display:flex;gap:12px;align-items:flex-start}
.todo-hd>span{display:flex;flex-direction:column;gap:2px;min-width:0}
.tick{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--recap);background:var(--card);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
button.tick{cursor:pointer;min-width:44px;min-height:44px;width:44px;height:44px;margin:-8px}
.tick[aria-pressed="true"],.tick.on{background:var(--recap);border-color:var(--recap)}
.tick.auto{border-style:dashed;border-color:var(--muted)}
.tick.auto.on{border-style:solid}
.todo .why{color:var(--ink);margin:0}
.fin{display:flex;flex-direction:column;gap:6px}
.fin-row{display:flex;gap:8px}
.fin-row input{flex:1;min-width:0}
.fin-row .btn{flex:none;width:auto}
.why-card b{font-family:var(--f-head);font-size:18px;line-height:1.3}
.basis button.locked{border-style:dashed;color:var(--muted);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.basis button.locked small{font-size:11.5px;font-weight:600;color:var(--t)}
.wk-card.locked{opacity:.8}

/* App-Tour */
body.touring{overflow:hidden}
#tour{position:fixed;inset:0;z-index:100}
.tour-dim{position:fixed;inset:0;background:rgba(18,32,48,.62)}
.tour-hole{position:fixed;border-radius:20px;box-shadow:0 0 0 9999px rgba(18,32,48,.62),0 0 0 3px var(--coral);pointer-events:none;transition:all .25s ease}
.tour-card{position:fixed;width:min(380px,calc(100vw - 16px));max-height:calc(100vh - 16px);overflow:auto;background:var(--card);color:var(--ink);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
.tour-card.wide{width:min(460px,calc(100vw - 16px))}
.tour-card.center{top:50%;left:50%;transform:translate(-50%,-50%)}
.tour-card .eyebrow{color:var(--coral)}
.tour-card h2{margin:0;font-family:var(--f-head);font-size:21px;line-height:1.2;letter-spacing:-.02em}
.tour-card p{margin:0;font-size:15px;line-height:1.5}
.tour-btns{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.tour-row{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.tour-dots{display:flex;gap:5px;justify-content:center}
.tour-dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.tour-dots i.on{background:var(--coral);width:16px;border-radius:3px}
.tour-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tour-list li{display:flex;flex-direction:column;gap:1px;padding:10px 12px;background:var(--bg);border-radius:12px;font-size:14px;line-height:1.4}
.tour-tab{width:100%;border-collapse:collapse;font-size:13px;line-height:1.35}
.tour-tab th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:0 6px 6px 0}
.tour-tab td{border-top:1px solid var(--line);padding:7px 6px 7px 0;vertical-align:top}
.tour-logic{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tour-logic li{display:flex;flex-direction:column;gap:1px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.4}
.tour-logic small{font-size:12px;color:var(--muted)}
.notice.demo{box-shadow:none;background:var(--bg)}
@media (prefers-reduced-motion:reduce){.tour-hole{transition:none}}

/* Kühlschrank-Karten: nur im Druck sichtbar */
#print{display:none}
@page{size:105mm 148mm;margin:0}
@media print{html,body{background:#fff!important}body>*:not(#print){display:none!important}#print{display:block}}
.fc{width:105mm;height:148mm;padding:7mm 7mm 5mm;background:#fff;color:var(--ink);font-family:var(--f-body);display:flex;flex-direction:column;gap:3mm;border-top:3mm solid var(--c);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.fc .hd{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-head);font-weight:800;font-size:11pt}
.fc .hd span,.fc .k{font-family:var(--f-body);font-size:6.5pt;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fc h1{font-size:19pt}
.fc .sub{font-size:8.5pt;color:var(--muted);margin:0}
.fc .rows{display:flex;flex-direction:column;gap:2.4mm;flex:1}
.fc .rw{display:grid;grid-template-columns:29mm 1fr;gap:3mm;align-items:end}
.fc .rw b{display:block;font-size:9pt}.fc .rw small{font-size:7pt;color:var(--muted)}
.fc .ln{border-bottom:.4mm solid var(--line);height:6mm}
.fc .shop,.fc .tip{background:var(--bg);border-radius:3mm;padding:2.5mm 3mm;display:flex;flex-direction:column;gap:1.5mm;font-size:8pt;line-height:1.4}
.fc .shop .ln{height:4.5mm}
.fc .grid2{display:grid;grid-template-columns:1fr 1fr;gap:2.5mm 4mm}
.fc .grid2 div{display:flex;flex-direction:column;gap:1.3mm}
.fc .ck{display:flex;gap:2mm;align-items:center;font-size:8.5pt}
.fc .ck i{width:3mm;height:3mm;border:.4mm solid var(--muted);border-radius:.8mm}
.fc .ft{font-size:6.5pt;color:var(--muted)}
.fc .wp{width:100%;border-collapse:collapse;flex:1}
.fc .wp th{font-size:6.5pt;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 1mm 1.5mm}
.fc .wp td{border-top:.4mm solid var(--line);height:8.5mm;padding:0 1mm;font-size:9pt;text-align:left}
.fc .wp i{display:block;width:3.2mm;height:3.2mm;border:.4mm solid var(--muted);border-radius:.8mm}
/* Handout A4, zwei Seiten */
@page a4{size:A4;margin:0}
.ho{page:a4;width:210mm;height:297mm;padding:14mm 15mm 10mm;background:#fff;color:var(--ink);font-family:var(--f-body);display:flex;flex-direction:column;gap:5mm;border-top:4mm solid var(--darm);break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ho:last-child{break-after:auto}
.ho .hd{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-head);font-weight:800}
.ho .hd>span:last-child{font-size:8pt;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:var(--f-body)}
.ho h1{font-size:28pt}
.ho .sub{font-size:11pt;color:var(--muted);margin:-2mm 0 0}
.ho-r{border-left:2mm solid var(--c);padding:2mm 0 2mm 5mm;display:flex;flex-direction:column;gap:1mm}
.ho-r b{font-family:var(--f-head);font-size:15pt}
.ho-r span{font-size:11pt;line-height:1.45}
.ho-r small{font-size:8.5pt;color:var(--muted)}
.ho-2{display:grid;grid-template-columns:1fr 1fr;gap:5mm}
.ho .tip{background:var(--bg);border-radius:4mm;padding:4mm 5mm;font-size:10pt;line-height:1.5}
.ho .tip.warn{background:var(--beweg-soft)}
.ho .ln{display:block;border-bottom:.4mm solid var(--line);height:7mm}
.ho-plate{display:grid;grid-template-columns:44mm 1fr;gap:6mm;align-items:center}
.ho-plate>div{display:flex;flex-direction:column;gap:1.8mm;font-size:10.5pt}
.ho-plate b{font-family:var(--f-head);font-size:14pt}
.ho-plate .lg{display:flex;gap:2.5mm;align-items:center}
.ho-plate .lg i{width:4mm;height:4mm;border-radius:1mm;background:var(--c);flex:none}
.ho-plate small{font-size:8.5pt;color:var(--muted);line-height:1.45}
.ho .ft{margin-top:auto;font-size:8pt;color:var(--muted)}
.ho .wp{width:100%;border-collapse:collapse}
.ho .wp th{font-size:8pt;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 2mm 2mm}
.ho .wp td{border-top:.4mm solid var(--line);height:13mm;padding:0 2mm;font-size:11pt}
.ho .wp i{display:block;width:5mm;height:5mm;border:.5mm solid var(--muted);border-radius:1mm}
</style>
</head>
<body>
<div id="app"></div>
<div id="print"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="logic.js"></script>
<script src="videos.js"></script>
<script src="inhalte.js"></script>
<script src="app.js"></script>
</body>
